[workspace]
resolver = "2"
members = [
  "helix-core",
  "helix-view",
  "helix-term",
  "helix-tui",
  "helix-lsp-types",
  "helix-lsp",
  "helix-event",
  "helix-loader",
  "helix-parsec",
  "helix-stdx",
  "xtask",
  "helix-ext",
]

default-members = [
  "helix-term"
]

[profile.release]
lto = "thin"

[profile.opt]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[profile.integration]
inherits = "test"
package.helix-core.opt-level = 2
package.helix-tui.opt-level = 2
package.helix-term.opt-level = 2

[workspace.dependencies]
tree-house = { version = "0.4", default-features = false }
nucleo = "0.5.0"
slotmap = "1.1.1"
thiserror = "2.0"
#tempfile = {package = "helix-ext", path = "./helix-ext"}
bitflags = "2.12"
unicode-segmentation = "1.13"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
foldhash = "0.2"
parking_lot = "0.12"
futures-executor = "0.3"
futures-util = { version = "0.3", features = ["std", "async-await"], default-features = false }
tokio-stream = "0.1.18"
toml = "1.1"
# termina = {path="../crates/termina"}
sonic-rs = {path="./helix-ext"}
helix-ext = {path = "./helix-ext"}
etcetera = "0.11"
arc-swap = "1.9"
arrayvec = "0.7"

# dev dependencies
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
quickcheck = { version = "1", default-features = false }
rustix = { path = "../crates/rustix",  features = [ "std", "stdio", "termios", "event", "fs", "thread" ], default-features = false}

[workspace.package]
version = "25.7.1"
edition = "2024"
authors = ["Blaž Hrastnik <blaz@mxxn.io>"]
repository = "https://github.com/helix-editor/helix"
homepage = "https://helix-editor.com"
license = "MPL-2.0"
rust-version = "1.98"
